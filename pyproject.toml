[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevforest"
version = "0.1.0"
description = "Bagged IG trees that vote on the next budgeted AFA question; optional Jev Decisions client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jevforest contributors" }]
dependencies = [
  "numpy==2.5.3",
]

[project.optional-dependencies]
eval = [
  "numpy==2.5.3",
]

[project.scripts]
jevforest = "jevforest.cli.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jevforest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
